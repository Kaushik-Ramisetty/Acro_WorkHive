# Alembic configuration for HRMS.
#
# Phase 1 introduces Alembic so future schema changes have proper history.
# The current schema is captured in versions/0001_baseline.py as an empty
# migration — stamp existing databases with:
#
#     alembic -c alembic.ini stamp head
#
# After that, every new schema change is a real Alembic revision and the
# idempotent ALTER blocks in app/main.py::_run_onboarding_migrations
# should be retired migration-by-migration.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Reads DATABASE_URL from env via alembic/env.py — leave the url blank.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
